# Gateway main configuration. Copy this file to gateway.yaml and edit locally.
# Do not commit gateway.yaml if it contains real secrets.
# Keys match the Settings fields in services/gateway/config.py.
# Empty YAML values can be filled from repository .env, services/gateway/.env,
# or process environment variables such as LARK_APP_ID.

gateway_public_base_url: http://127.0.0.1:8000

# Target Feishu/Lark Drive folder token for generated artifacts.
# When dev_skip_lark is true, the gateway returns local placeholder artifacts.
artifacts_drive_folder_token: ""
dev_skip_lark: true

# External agents. For one agent service, set agents_base_url and agents_m2m_token.
# For multiple agent services, copy ../agent/agents.example.yaml to ../agent/agents.yaml
# and set agents_registry_path to ../agent/agents.yaml.
agents_base_url: https://your-agents.example.com
agents_m2m_token: dev-m2m-secret
agents_registry_path: ""

# Feishu/Lark application credentials.
lark_app_id: ""
lark_app_secret: ""

# Feishu/Lark event verification settings. Leave empty when event verification is unused.
lark_event_encrypt_key: ""
lark_verification_token: ""

# Frontend and OAuth URLs. These must match the configured app callback domains.
public_web_base_url: http://127.0.0.1:5173
oauth_redirect_uri: http://127.0.0.1:8000/api/v1/auth/callback

# Session cookie signing secret. Replace in production.
session_secret: change-me-in-production

# OpenAPI base URL. Use https://open.larksuite.com for Lark global if needed.
lark_base_url: https://open.feishu.cn

# Reserved legacy field. Gateway uses OpenAPI directly.
lark_cli_path: lark-cli

# Comma-separated allowed frontend origins.
cors_origins: http://127.0.0.1:5173,http://localhost:5173
